# Insert these locations inside the existing gtclub.tw HTTPS server block.
location = /formula-kart {
    return 308 /formula-kart/;
}

location = /formula-kart/healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
}

location = /formula-kart/ws {
    limit_conn perip_conn 20;
    proxy_pass http://127.0.0.1:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 65s;
    proxy_send_timeout 10s;
    proxy_buffering off;
}

location = /formula-kart/ {
    root /var/www/formula-kart/current/web;
    rewrite ^ /index.html break;
    add_header Cache-Control "no-cache";
}

location ^~ /formula-kart/assets/ {
    alias /var/www/formula-kart/current/web/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /formula-kart/team-logos/ {
    alias /var/www/formula-kart/current/web/team-logos/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}
